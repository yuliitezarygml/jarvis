[package]
name = "jarvis-tts-rs"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "native"]

[dependencies]
pocket-native = { path = "native" }
anyhow = "1"
axum = {version="0.8",features=["json"]}
bytes = "1"
futures-util = "0.3"
serde = { version="1",features=["derive"] }
serde_json = "1"
tokio = {version="1",features=["full"]}
tracing="0.1"
tracing-subscriber="0.3"
uuid={version="1",features=["v4"]}
subtle="2"
tokio-util="0.7"
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = {version="0.23",default-features=false,features=["fancy-regex"]}
regex="1"
rayon="1"
num2words2-core="0.2"
