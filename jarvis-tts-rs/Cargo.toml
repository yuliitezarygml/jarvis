[package]
name = "jarvis-tts-rs"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "native"]

[dependencies]
pocket-native = { path = "native" }
anyhow = "1"
axum = {version="0.8",features=["json"]}
bytes = "1"
futures-util = "0.3"
serde = { version="1",features=["derive"] }
serde_json = "1"
tokio = {version="1",features=["full"]}
tokio-stream="0.1"
tracing="0.1"
tracing-subscriber="0.3"
uuid={version="1",features=["v4"]}
subtle="2"
tokio-util="0.7"
