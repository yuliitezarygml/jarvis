[package]
name = "pocket-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
[dependencies]
ptts = { git = "https://github.com/gabrieldemarmiesse/xn-ptts", rev = "7efa26973f81bba42cf2ace8da2c1eb9b605d54d", default-features = false, features = ["audio"] }
xn = "=0.2.11"
anyhow = "1"
half = "2"
log = "0.4"
rand = "0.9"
rand_distr = "0.5"
safetensors = "0.7"
sentencepiece-rs = "=0.2.2"
serde = {version="1",features=["derive"]}
serde_json = "1"
serde_yaml = "0.9"
symphonia = { version="0.5",features=["wav","pcm"] }
tokenizers = {version="0.23", default-features=false,features=["fancy-regex"]}
