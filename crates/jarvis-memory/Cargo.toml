[package]
name = "jarvis-memory"
version = "0.1.0"
edition = "2024"
description = "Память и самообучение J.A.R.V.I.S.: SQLite + FTS5 со стеммингом, факты, уроки (сигнатуры ошибок), плейбуки, рефлектор"


[dependencies]
jarvis-core = { path = "../jarvis-core" }
rusqlite = { version = "0.43", features = ["bundled"] }
rust-stemmers = "1.2"
sha2 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
tempfile = "3"
