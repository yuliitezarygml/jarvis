[package]
name = "jarvis-core"
version = "0.1.0"
edition = "2024"
description = "Общие контракты J.A.R.V.I.S.: уровни риска, инструменты, события HUD, типы LLM, конфиг, протокол STT"

# Пока каждый крейт собирается отдельно (свой target), чтобы параллельные агенты не блокировали друг друга.
# На этапе интеграции эту таблицу уберём и соберём общий workspace в корне.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
