[package]
name = "jarvis-agent"
version = "0.1.0"
edition = "2024"
description = "«Мозг» J.A.R.V.I.S.: цикл агента «наблюдай → действуй → проверь», политика подтверждений, краткосрочная память диалога"

# Пока каждый крейт собирается отдельно (свой target), чтобы параллельные агенты не блокировали друг друга.
# На этапе интеграции эту таблицу уберём и соберём общий workspace в корне.
[workspace]

[dependencies]
jarvis-core = { path = "../jarvis-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "test-util"] }
