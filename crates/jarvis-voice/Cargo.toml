[package]
name = "jarvis-voice"
version = "0.1.0"
edition = "2024"
description = "Голос J.A.R.V.I.S. (клиент): захват, VAD, STT-клиенты, нормализатор речи, TTS-клиент, воспроизведение, барж-ин"


[dependencies]
jarvis-core = { path = "../jarvis-core" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = "0.7"
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
url = "2.5"
# Аудио
cpal = "0.18"
earshot = "1"
rubato = "5"
# Сеть: TLS только через rustls + ring; доверие к серверу Xeon — только CA из файла.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# Локальное распознавание (sherpa-onnx): при сборке скачиваются готовые DLL с GitHub-релиза k2-fsa
# и копируются рядом с exe. `shared`, а не `static`: статическая сборка под Windows — /MT и конфликтует
# с CRT остальных C-зависимостей (/MD).
sherpa-onnx = { version = "=2.0.2", default-features = false, features = ["shared"], optional = true }

[features]
default = []
# Распознавание речи на этом ПК (GigaAM v3 CTC). Включено в приложении (src-tauri).
local-stt = ["dep:sherpa-onnx"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
