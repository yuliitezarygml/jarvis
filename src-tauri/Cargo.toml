[package]
name = "jarvis"
version = "0.1.0"
description = "Jarvis desktop application"
edition = "2021"
rust-version = "1.88"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "http2"] }
futures-util = "0.3"
eventsource-stream = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.37"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
anyhow = "1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["clock"] }
sherpa-onnx = "=2.0.1"
sha2 = "0.10"
