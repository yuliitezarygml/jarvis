[package]
name = "jarvis"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "J.A.R.V.I.S. — оболочка Tauri 2: окна hud/corner/overlay/settings, трей, хоткеи, мост событий"
default-run = "jarvis"


[lib]
name = "jarvis_lib"
path = "src/lib.rs"

[[bin]]
name = "jarvis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
jarvis-core = { path = "../crates/jarvis-core" }
jarvis-agent = { path = "../crates/jarvis-agent" }
jarvis-llm = { path = "../crates/jarvis-llm" }
jarvis-voice = { path = "../crates/jarvis-voice", features = ["local-stt"] }
jarvis-memory = { path = "../crates/jarvis-memory" }
jarvis-pc = { path = "../crates/jarvis-pc" }
jarvis-sys = { path = "../crates/jarvis-sys" }
jarvis-web = { path = "../crates/jarvis-web" }
jarvis-kb = { path = "../crates/jarvis-kb" }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Та же версия, что у jarvis-voice: имя устройства ввода/вывода по умолчанию для экрана «Аудио».
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tauri = { version = "2.12", features = ["tray-icon", "test"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }
tempfile = "3"
