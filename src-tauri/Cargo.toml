[package]
name = "jarvis"
version = "0.1.0"
description = "Jarvis desktop application"
edition = "2021"
rust-version = "1.88"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "http2"] }
futures-util = "0.3"
eventsource-stream = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sysinfo = "0.37"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
anyhow = "1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["clock"] }
sherpa-onnx = "=2.0.1"
sha2 = "0.10"
earshot = "1.2.2"
pulldown-cmark = { version = "0.13", default-features = false }
num2words2-core = "0.2"
regex = "1"
dom_query = { version = "0.29", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }
